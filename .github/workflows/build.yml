name: Build BEEPZ APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/beepz/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

      - name: Create BEEPZ starter app
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>BEEPZ</title>

              <style>
                  * {
                      box-sizing: border-box;
                      margin: 0;
                      padding: 0;
                  }

                  html,
                  body {
                      width: 100%;
                      height: 100%;
                      overflow: hidden;
                      background: #080808;
                      color: white;
                      font-family: Arial, sans-serif;
                  }

                  body {
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }

                  .container {
                      width: 100%;
                      height: 100%;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      padding: 30px;
                      text-align: center;
                  }

                  .logo {
                      font-size: 52px;
                      font-weight: 900;
                      letter-spacing: 4px;
                      margin-bottom: 12px;
                  }

                  .tagline {
                      font-size: 16px;
                      opacity: 0.7;
                      margin-bottom: 40px;
                  }

                  .status {
                      padding: 14px 24px;
                      border: 1px solid rgba(255,255,255,0.15);
                      border-radius: 30px;
                      font-size: 14px;
                      opacity: 0.8;
                  }
              </style>
          </head>

          <body>

              <main class="container">

                  <div class="logo">BEEPZ</div>

                  <div class="tagline">
                      Say it. Don't just type it.
                  </div>

                  <div class="status">
                      BEEPZ is starting...
                  </div>

              </main>

          </body>
          </html>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/beepz/app/MainActivity.java <<'EOF'
          package com.beepz.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create colors
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="app_background">#080808</color>
          </resources>
          EOF

      - name: Create styles
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#ff3b30</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>

              </style>

          </resources>
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="BEEPZ"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create root Gradle files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BEEPZ"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.beepz.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.beepz.app'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All signing secrets are present."

      - name: Restore permanent BEEPZ keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > beepz-release.jks

          if [ ! -s beepz-release.jks ]; then
            echo "ERROR: Keystore restoration failed."
            exit 1
          fi

          echo "BEEPZ permanent keystore restored."

      - name: Verify project
        run: |
          echo "Checking BEEPZ project..."

          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/beepz/app/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle
          test -f beepz-release.jks

          echo "BEEPZ project verification successful."

      - name: Create Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed BEEPZ APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/beepz-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          echo "APK output:"
          ls -lh app/build/outputs/apk/release/

          test -f app/build/outputs/apk/release/app-release.apk

          echo "SIGNED BEEPZ APK CREATED SUCCESSFULLY."

      - name: Upload BEEPZ APK
        uses: actions/upload-artifact@v4
        with:
          name: BEEPZ-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
