name: Build BEEPZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify HTML
        run: |
          find . -type f \( -name "*.html" -o -name "*.htm" \) -print

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/beepz/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          HTML=$(find . -type f \( -name "*.html" -o -name "*.htm" \) | head -n 1)

          if [ -z "$HTML" ]; then
            echo "HTML file not found"
            exit 1
          fi

          echo "Using HTML: $HTML"

          cp "$HTML" app/src/main/assets/index.html

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/beepz/app/MainActivity.java <<'EOF'
          package com.beepz.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create resources
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="app_background">#080808</color>
          </resources>
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="BEEPZ"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create styles
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#ff3b30</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>

              </style>

          </resources>
          EOF

      - name: Create root Gradle files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BEEPZ"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.beepz.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.beepz.app'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {

                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }

              }

          }
          EOF

      - name: Restore permanent BEEPZ keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > beepz-release.jks

          echo "Keystore restored successfully"

      - name: Create Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed BEEPZ APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/beepz-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          ls -lh app/build/outputs/apk/release/

          test -f app/build/outputs/apk/release/app-release.apk

          echo "SIGNED BEEPZ APK READY"

      - name: Upload signed BEEPZ APK
        uses: actions/upload-artifact@v4
        with:
          name: BEEPZ-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Create project folders
        run: |
          mkdir -p app/src/main/java/com/beepz/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BEEPZ"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

      - name: Create Android app configuration
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.beepz.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.beepz.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="BEEPZ"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create app theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                     parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/beepz/app/MainActivity.java <<'EOF'
          package com.beepz.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/beepz.html"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create BEEPZ interface
        run: |
          cat > app/src/main/assets/beepz.html <<'EOF'
          <!DOCTYPE html>
          <html>

          <head>

          <meta charset="UTF-8">

          <meta
              name="viewport"
              content="width=device-width,
              initial-scale=1.0,
              maximum-scale=1.0,
              user-scalable=no">

          <title>BEEPZ</title>

          <style>

          * {
              box-sizing: border-box;
              -webkit-tap-highlight-color: transparent;
          }

          body {
              margin: 0;
              background: #080808;
              color: white;
              font-family: Arial, sans-serif;
          }

          .app {
              min-height: 100vh;
              padding-bottom: 75px;
          }

          header {
              height: 70px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 18px;
              background: #080808;
              border-bottom: 1px solid #222;
          }

          .logo {
              font-size: 28px;
              font-weight: 900;
              letter-spacing: 2px;
          }

          .logo span {
              color: #ff3b30;
          }

          header button {
              border: 0;
              background: none;
              color: white;
              font-size: 22px;
          }

          main {
              padding: 18px;
          }

          .page {
              display: none;
          }

          .page.active {
              display: block;
          }

          h1 {
              font-size: 25px;
              margin: 0 0 5px;
          }

          .sub {
              color: #888;
              margin-bottom: 20px;
          }

          .post {
              background: #121212;
              border: 1px solid #242424;
              border-radius: 15px;
              padding: 15px;
              margin-bottom: 18px;
          }

          .user {
              display: flex;
              align-items: center;
              gap: 10px;
          }

          .avatar {
              width: 44px;
              height: 44px;
              border-radius: 50%;
              background: #292929;
              display: flex;
              align-items: center;
              justify-content: center;
          }

          .post-text {
              line-height: 1.5;
              margin: 15px 0;
          }

          .media {
              height: 180px;
              border-radius: 12px;
              background: #202020;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 45px;
              margin-bottom: 12px;
          }

          .actions {
              display: flex;
              gap: 16px;
              flex-wrap: wrap;
          }

          .actions button {
              border: 0;
              background: none;
              color: #bbb;
          }

          .voice {
              color: #ff3b30 !important;
              font-weight: bold;
          }

          .card {
              background: #121212;
              border: 1px solid #242424;
              border-radius: 15px;
              padding: 16px;
              margin-bottom: 12px;
          }

          .music {
              display: flex;
              align-items: center;
              gap: 13px;
          }

          .cover {
              width: 55px;
              height: 55px;
              border-radius: 9px;
              background: #292929;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 22px;
          }

          .music-info {
              flex: 1;
          }

          .artist {
              color: #888;
              font-size: 13px;
              margin-top: 4px;
          }

          .play {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              border: 0;
              background: white;
              color: black;
          }

          .bottom {
              position: fixed;
              left: 0;
              right: 0;
              bottom: 0;
              height: 68px;
              background: #101010;
              border-top: 1px solid #252525;
              display: flex;
              justify-content: space-around;
              align-items: center;
              z-index: 20;
          }

          .nav {
              border: 0;
              background: none;
              color: #777;
              font-size: 11px;
          }

          .nav.active {
              color: white;
          }

          .nav-icon {
              display: block;
              font-size: 21px;
              margin-bottom: 3px;
          }

          </style>

          </head>

          <body>

          <div class="app">

          <header>

              <div class="logo">
                  BEEP<span>Z</span>
              </div>

              <button onclick="notify()">
                  🔔
              </button>

          </header>

          <main>

          <section id="home" class="page active">

              <h1>What's happening?</h1>

              <div class="sub">
                  Say it. Don't just type it.
              </div>

              <article class="post">

                  <div class="user">

                      <div class="avatar">
                          🎧
                      </div>

                      <div>
                          <b>BEEPZ Music</b>

                          <div style="color:#777;font-size:12px">
                              Just now
                          </div>
                      </div>

                  </div>

                  <div class="post-text">
                      Welcome to BEEPZ — discover people,
                      music and voices.
                  </div>

                  <div class="media">
                      🎵
                  </div>

                  <div class="actions">

                      <button onclick="like(this)">
                          ♡ Like
                      </button>

                      <button>
                          💬 Comment
                      </button>

                      <button
                          class="voice"
                          onclick="voice()">
                          🎙️ Voice
                      </button>

                      <button>
                          ↗ Share
                      </button>

                  </div>

              </article>

          </section>

          <section id="discover" class="page">

              <h1>Discover</h1>

              <div class="sub">
                  Find new music and rising artists.
              </div>

              <div class="card music">

                  <div class="cover">
                      🎵
                  </div>

                  <div class="music-info">
                      <b>Rising Sound</b>

                      <div class="artist">
                          Underground Artist
                      </div>
                  </div>

                  <button
                      class="play"
                      onclick="play(this)">
                      ▶
                  </button>

              </div>

              <div class="card music">

                  <div class="cover">
                      🎧
                  </div>

                  <div class="music-info">
                      <b>New Wave</b>

                      <div class="artist">
                          BEEPZ Discovery
                      </div>
                  </div>

                  <button
                      class="play"
                      onclick="play(this)">
                      ▶
                  </button>

              </div>

          </section>

          <section id="live" class="page">

              <h1>Live</h1>

              <div class="sub">
                  Discover artists going live.
              </div>

              <div class="card">

                  <div class="media">
                      🔴
                  </div>

                  <b>Artist Live Room</b>

                  <p style="color:#888">
                      Live streaming will connect here.
                  </p>

                  <button
                      style="
                      background:#ff3b30;
                      padding:13px 20px;
                      border-radius:10px;
                      color:white;"
                      onclick="live()">
                      Join Live
                  </button>

              </div>

          </section>

          <section id="chat" class="page">

              <h1>Messages</h1>

              <div class="sub">
                  Your conversations will appear here.
              </div>

              <div
                  class="card"
                  onclick="chat()">
                  💬 &nbsp; BEEPZ Team
              </div>

              <div
                  class="card"
                  onclick="chat()">
                  🎤 &nbsp; Artist
              </div>

          </section>

          <section id="profile" class="page">

              <h1>Your Profile</h1>

              <div
                  class="card"
                  style="text-align:center">

                  <div
                      class="avatar"
                      style="
                      margin:auto;
                      width:85px;
                      height:85px;
                      font-size:30px;">

                      👤

                  </div>

                  <h2>
                      BEEPZ User
                  </h2>

                  <div class="sub">
                      Your account profile will connect here.
                  </div>

              </div>

          </section>

          </main>

          <nav class="bottom">

              <button
                  class="nav active"
                  onclick="navigate('home',this)">

                  <span class="nav-icon">
                      ⌂
                  </span>

                  Home

              </button>

              <button
                  class="nav"
                  onclick="navigate('discover',this)">

                  <span class="nav-icon">
                      🔎
                  </span>

                  Discover

              </button>

              <button
                  class="nav"
                  onclick="navigate('live',this)">

                  <span class="nav-icon">
                      🔴
                  </span>

                  Live

              </button>

              <button
                  class="nav"
                  onclick="navigate('chat',this)">

                  <span class="nav-icon">
                      💬
                  </span>

                  Chat

              </button>

              <button
                  class="nav"
                  onclick="navigate('profile',this)">

                  <span class="nav-icon">
                      👤
                  </span>

                  Profile

              </button>

          </nav>

          </div>

          <script>

          function navigate(page, button) {

              document
                  .querySelectorAll('.page')
                  .forEach(
                      p => p.classList.remove('active')
                  );

              document
                  .getElementById(page)
                  .classList.add('active');

              document
                  .querySelectorAll('.nav')
                  .forEach(
                      n => n.classList.remove('active')
                  );

              button.classList.add('active');

              window.scrollTo(0, 0);
          }

          function like(button) {

              if (button.innerHTML.includes('♡')) {
                  button.innerHTML = '♥ Liked';
              } else {
                  button.innerHTML = '♡ Like';
              }

          }

          function voice() {

              alert(
                  '30-second voice comments will be added next.'
              );

          }

          function play(button) {

              button.innerHTML =
                  button.innerHTML === '▶'
                  ? '❚❚'
                  : '▶';

          }

          function live() {

              alert(
                  'Live streaming will be connected next.'
              );

          }

          function chat() {

              alert(
                  'Real-time chat will be connected next.'
              );

          }

          function notify() {

              alert(
                  'BEEPZ notifications will connect next.'
              );

          }

          </script>

          </body>

          </html>
          EOF

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      - name: Verify project
        run: |
          echo "Checking BEEPZ project..."
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/beepz/app/MainActivity.java
          test -f app/src/main/assets/beepz.html
          test -f gradlew
          echo "Project files verified."

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK FOUND:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload BEEPZ APK
        uses: actions/upload-artifact@v4
        with:
          name: BEEPZ-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
